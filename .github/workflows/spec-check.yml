name: spec-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 关键词表 / 运算符 / dscc 覆盖校验
        run: python3 tools/ds_keywords.py check --json spec/keywords.json
      - name: 词法自检 + 示例扫描
        run: python3 tools/dslex.py
      - name: 参考驱动与语言特性测试
        run: python3 -m unittest tests.test_driver -v
      - name: 终端驱动冒烟
        run: |
          ./dscc examples/tour.ds | head -5
          ./ds -c 'package t
          fn main() { println("cli ok") }'
      - name: AI 学习包校验
        run: |
          python3 tools/make_datasets.py --check
          python3 tools/build_ai_kit.py --check
          python3 tools/ds_bench.py --list > /dev/null
      - name: C 驱动构建与对拍
        run: |
          make -C c
          sh c/run_tests.sh
